<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container" style="max-width: 1000px;">
    <div class="header">
      <h2>Super Admin</h2>
      <button class="btn-secondary" style="width: auto; padding: 8px 16px;" onclick="logout()">ออกจากระบบ</button>
    </div>

    <!-- Tab navigation -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button onclick="showTab('users')" id="tab-users" style="flex: 1;">จัดการผู้ใช้งาน</button>
      <button onclick="showTab('classes')" id="tab-classes" style="flex: 1;" class="btn-secondary">ภาพรวมรายวิชา</button>
    </div>

    <!-- Users Management -->
    <div id="view-users" class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">จัดการผู้ใช้งานระบบ</h3>
        <button onclick="openUserForm()" style="width: auto; padding: 8px 16px;">+ เพิ่มผู้ใช้งานใหม่</button>
      </div>
      
      <div id="edit-user-form" class="glass-card mb-4 d-none" style="background: rgba(255,255,255,0.05); border: 1px solid var(--primary);">
        <h4 id="user-form-title">เพิ่มผู้ใช้งานใหม่</h4>
        <form onsubmit="handleUserForm(event)">
          <input type="hidden" id="u-id">
          <div class="form-group" style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" id="u-username" placeholder="Username (เช่น 66123456)" required style="flex:1">
            <input type="text" id="u-password" placeholder="Password (ปล่อยว่างถ้าไม่เปลี่ยน)" style="flex:1">
            <select id="u-role" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:#fff; color:#333;">
              <option value="student">นักศึกษา</option>
              <option value="teacher">อาจารย์</option>
              <option value="superadmin">Super Admin</option>
            </select>
          </div>
          <div class="form-group" style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" id="u-firstname" placeholder="ชื่อจริง / ชื่ออาจารย์" required style="flex:1">
            <input type="text" id="u-lastname" placeholder="นามสกุล (ถ้ามี)" style="flex:1">
          </div>
          <div class="form-group" style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" id="u-major" placeholder="สาขาวิชา (เช่น ฟิสิกส์)" style="flex:1">
            <input type="text" id="u-year" placeholder="ชั้นปี (เช่น 1)" style="flex:1">
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" style="width:auto; flex:1;">บันทึกข้อมูล</button>
            <button type="button" class="btn-secondary" style="width:auto;" onclick="closeUserForm()">ยกเลิก</button>
          </div>
        </form>
      </div>

      <button onclick="loadUsers()" class="btn-secondary mb-4">รีเฟรชข้อมูล</button>
      <div id="users-list" class="table-responsive">
        <!-- Users loaded here -->
      </div>
    </div>

    <!-- Classes Overview -->
    <div id="view-classes" class="glass-card d-none">
      <h3>ภาพรวมรายวิชาทั้งหมด</h3>
      <button onclick="loadClasses()" class="btn-secondary mb-4">รีเฟรชข้อมูล</button>
      <div id="class-list" class="list-group">
        <!-- Classes loaded here -->
      </div>
    </div>

    <!-- Class Detail (Edit & Matrix) -->
    <div id="view-class-detail" class="glass-card d-none">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="detail-title" style="margin:0;">รายละเอียดวิชา</h3>
        <button class="btn-secondary" style="width: auto;" onclick="closeClass()">&larr; กลับ</button>
      </div>
      
      <form onsubmit="handleEditClass(event)" class="mb-4">
        <div class="form-group" style="display: flex; gap: 10px;">
          <input type="text" id="edit-c-code" placeholder="รหัสวิชา" required style="flex: 1;">
          <input type="text" id="edit-c-name" placeholder="ชื่อวิชา" required style="flex: 2;">
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" style="width: auto; flex: 1;">บันทึกการแก้ไข</button>
          <button type="button" class="btn-danger" style="width: auto;" onclick="deleteClass()">ลบรายวิชานี้</button>
        </div>
      </form>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h4 style="margin: 0;">ประวัติการเข้าเรียน (15 สัปดาห์)</h4>
        <div style="display: flex; gap: 10px;">
          <button onclick="loadAttendance()" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.9rem;">รีเฟรชข้อมูล</button>
          <button onclick="exportToExcel()" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.9rem; background: #10B981; color: white; border-color: #10B981;">📥 Excel</button>
          <button onclick="exportToWord()" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.9rem; background: #3B82F6; color: white; border-color: #3B82F6;">📥 Word</button>
        </div>
      </div>
      <div id="attendance-list" class="table-responsive">
        <!-- Matrix loaded here -->
      </div>
    </div>

  </div>

  <!-- Sci-Fi Mobile Bottom Navigation for Super Admin -->
  <nav class="mobile-bottom-nav">
    <a href="#" class="nav-item active" onclick="showTab('users'); return false;">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>ผู้ใช้</span>
    </a>
    <a href="#" class="nav-item center-action" onclick="showTab('classes'); return false;">
      <div class="action-btn">
        <svg viewBox="0 0 24 24" fill="white" width="28" height="28"><path d="M4 14h4v-4H4v4zm0 5h4v-4H4v4zM4 9h4V5H4v4zm5 5h12v-4H9v4zm0 5h12v-4H9v4zM9 5v4h12V5H9z"/></svg>
      </div>
    </a>
    <a href="#" class="nav-item" onclick="logout(); return false;">
      <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      <span>ออกระบบ</span>
    </a>
  </nav>

  <script src="assets/js/app.js"></script>
  <script>
    let currentUser = null;

    async function init() {
      currentUser = await checkAuth();
      if (currentUser && currentUser.role === 'superadmin') {
        loadUsers();
      }
    }

    function showTab(tab) {
      document.getElementById('view-class-detail').classList.add('d-none');
      if (tab === 'users') {
        document.getElementById('view-users').classList.remove('d-none');
        document.getElementById('view-classes').classList.add('d-none');
        document.getElementById('tab-users').className = '';
        document.getElementById('tab-classes').className = 'btn-secondary';
        loadUsers();
      } else {
        document.getElementById('view-users').classList.add('d-none');
        document.getElementById('view-classes').classList.remove('d-none');
        document.getElementById('tab-users').className = 'btn-secondary';
        document.getElementById('tab-classes').className = '';
        loadClasses();
      }
    }

    async function loadUsers() {
      const res = await apiCall('users.php', 'list');
      if (res.success) {
        const list = document.getElementById('users-list');
        if (res.data.length === 0) {
            list.innerHTML = '<p>ไม่มีข้อมูลผู้ใช้งาน</p>';
            return;
        }
        
        let html = `
          <table class="table">
            <thead>
              <tr>
                <th>ระดับสิทธิ์</th>
                <th>Username</th>
                <th>ชื่อ-สกุล</th>
                <th>สาขา / ปี</th>
                <th>จัดการ</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        res.data.forEach(u => {
            const roleBadge = u.role === 'superadmin' ? '<span style="color:red; font-weight:bold;">Super Admin</span>' :
                              u.role === 'teacher' ? '<span style="color:var(--primary); font-weight:bold;">อาจารย์</span>' : 'นักศึกษา';
            const dispName = u.name ? u.name : `${u.firstname || ''} ${u.lastname || ''}`;
            html += `
              <tr>
                <td>${roleBadge}</td>
                <td>${u.username}</td>
                <td>${dispName}</td>
                <td>${u.major || '-'} / ${u.year || '-'}</td>
                <td>
                  <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem; width: auto;" onclick='editUser(${JSON.stringify(u)})'>แก้ไข</button>
                  ${u.role !== 'superadmin' ? `
                    <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem; width: auto;" onclick="resetPassword('${u.id}')">เปลี่ยนรหัสผ่าน</button>
                    <button class="btn-danger" style="padding: 4px 8px; font-size: 0.8rem; width: auto;" onclick="deleteUser('${u.id}')">ลบ</button>
                  ` : ''}
                </td>
              </tr>
            `;
        });
        
        html += `</tbody></table>`;
        list.innerHTML = html;
      }
    }

    async function loadClasses() {
      const res = await apiCall('classes.php', 'list');
      if (res.success) {
        const list = document.getElementById('class-list');
        list.innerHTML = res.data.map(c => `
          <div class="list-item" style="cursor: pointer;" onclick="openClass('${c.id}', '${c.code || ''}', '${c.name}')">
            <div>
              <strong>[${c.code || '-'}] ${c.name}</strong>
              <div style="color: var(--text-muted); font-size:0.8rem">รหัสคลาส: ${c.id} | สร้างเมื่อ: ${c.created_at}</div>
            </div>
            <button class="btn-secondary" style="width: auto; padding: 4px 12px;">จัดการ &rarr;</button>
          </div>
        `).join('') || '<p style="color: var(--text-muted)">ยังไม่มีรายวิชาในระบบ</p>';
      }
    }

    let currentClassId = null;

    function openClass(id, code, name) {
        currentClassId = id;
        document.getElementById('view-classes').classList.add('d-none');
        document.getElementById('view-class-detail').classList.remove('d-none');
        document.getElementById('edit-c-code').value = code !== '-' && code !== 'null' ? code : '';
        document.getElementById('edit-c-name').value = name;
        document.getElementById('detail-title').innerText = `รายละเอียดวิชา: [${code || '-'}] ${name}`;
        loadAttendance();
    }

    function closeClass() {
        currentClassId = null;
        document.getElementById('view-classes').classList.remove('d-none');
        document.getElementById('view-class-detail').classList.add('d-none');
        loadClasses();
    }

    async function handleEditClass(e) {
      e.preventDefault();
      const res = await apiCall('classes.php', 'edit', 'POST', {
        id: currentClassId,
        code: document.getElementById('edit-c-code').value,
        name: document.getElementById('edit-c-name').value
      });
      alert(res.message);
      if (res.success) {
        document.getElementById('detail-title').innerText = `รายละเอียดวิชา: [${document.getElementById('edit-c-code').value}] ${document.getElementById('edit-c-name').value}`;
      }
    }

    async function deleteClass() {
      if (!confirm("คุณแน่ใจหรือไม่ที่จะลบวิชานี้? ประวัติการเช็คชื่อทั้งหมดจะถูกลบทิ้งถาวร!")) return;
      const res = await apiCall('classes.php', 'delete', 'POST', { id: currentClassId });
      alert(res.message);
      if (res.success) closeClass();
    }

    async function loadAttendance() {
      if (!currentClassId) return;
      const res = await apiCall('attendance.php', 'report&class_id=' + currentClassId);
      if (res.success) {
        const list = document.getElementById('attendance-list');
        if (res.data.length === 0) {
            list.innerHTML = '<p style="color: var(--text-muted)">ยังไม่มีประวัติการเข้าเรียนในวิชานี้</p>';
            return;
        }
        
        const sessions = [];
        res.data.forEach(a => {
            if (!sessions.find(s => s.token === a.session_token)) {
                sessions.push({ token: a.session_token, time: new Date(a.timestamp).getTime() });
            }
        });
        sessions.sort((a, b) => a.time - b.time);
        
        const maxWeeks = 15;
        const students = {};
        res.data.forEach(a => {
            if (!students[a.student_id]) {
                students[a.student_id] = {
                    code: a.student_code,
                    firstname: a.firstname,
                    lastname: a.lastname,
                    major: a.major,
                    year: a.year,
                    attended: {},
                    total: 0
                };
            }
            students[a.student_id].attended[a.session_token] = a.timestamp;
            students[a.student_id].total++;
        });
        
        let html = `
          <table class="table">
            <thead>
              <tr>
                <th class="sticky-col">รหัสนักศึกษา</th>
                <th class="sticky-col2">ชื่อ-สกุล</th>
                <th>สาขา</th>
                <th>ปี</th>
        `;
        
        for (let i = 0; i < maxWeeks; i++) {
            let label = (i < sessions.length) 
                        ? `W${i+1}` 
                        : `W${i+1}`;
            html += `<th>${label}</th>`;
        }
        
        html += `
                <th>รวม</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        Object.values(students).forEach(st => {
            html += `
              <tr>
                <td class="sticky-col">${st.code || '-'}</td>
                <td class="sticky-col2">${st.firstname || '-'} ${st.lastname || '-'}</td>
                <td>${st.major || '-'}</td>
                <td>${st.year || '-'}</td>
            `;
            for (let i = 0; i < maxWeeks; i++) {
                if (i < sessions.length) {
                    const timeScanned = st.attended[sessions[i].token];
                    if (timeScanned) {
                        const timeOnly = timeScanned.split(' ')[1] || timeScanned;
                        html += `<td style="color:var(--success); text-align:center;">✅<br><span style="font-size:0.7rem; color:var(--text-muted)">${timeOnly}</span></td>`;
                    } else {
                        html += `<td style="color:var(--danger); text-align:center;">❌</td>`;
                    }
                } else {
                    html += `<td style="color:var(--text-muted); text-align:center;">-</td>`;
                }
            }
            html += `
                <td style="text-align:center;"><strong>${st.total}</strong>/${sessions.length}</td>
              </tr>
            `;
        });
        
        html += `
            </tbody>
          </table>
        `;
        list.innerHTML = html;
        list.querySelector('table').id = 'export-table';
      }
    }

    function exportToExcel() {
      const table = document.getElementById('export-table');
      if (!table) {
          alert('ไม่พบข้อมูลตาราง'); return;
      }
      const wb = XLSX.utils.table_to_book(table, {sheet: "Attendance"});
      XLSX.writeFile(wb, document.getElementById('detail-title').innerText.replace('รายละเอียดวิชา: ', '') + ".xlsx");
    }

    function exportToWord() {
      const table = document.getElementById('export-table');
      if (!table) {
          alert('ไม่พบข้อมูลตาราง'); return;
      }
      
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
      const footer = "</body></html>";
      
      const title = document.getElementById('detail-title').innerText.replace('รายละเอียดวิชา: ', '');
      const sourceHTML = header + `<h2 style="font-family: sans-serif;">${title}</h2>` + "<table border='1' style='border-collapse: collapse; width: 100%; font-family: sans-serif;'>" + table.innerHTML + "</table>" + footer;
      
      const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
      const fileDownload = document.createElement("a");
      document.body.appendChild(fileDownload);
      fileDownload.href = source;
      fileDownload.download = title + '.doc';
      fileDownload.click();
      document.body.removeChild(fileDownload);
    }

    async function resetPassword(id) {
      const newPwd = prompt("กรุณาระบุรหัสผ่านใหม่สำหรับผู้ใช้นี้:");
      if (!newPwd) return;
      
      const res = await apiCall('users.php', 'reset_password', 'POST', { user_id: id, new_password: newPwd });
      alert(res.message);
    }

    async function deleteUser(id) {
      if (!confirm("คุณแน่ใจหรือไม่ที่จะลบผู้ใช้นี้? การกระทำนี้ไม่สามารถย้อนกลับได้")) return;
      
      const res = await apiCall('users.php', 'delete', 'POST', { user_id: id });
      alert(res.message);
      if (res.success) loadUsers();
    }

    function openUserForm() {
      document.getElementById('edit-user-form').classList.remove('d-none');
      document.getElementById('user-form-title').innerText = "เพิ่มผู้ใช้งานใหม่";
      document.getElementById('u-id').value = '';
      document.getElementById('u-username').value = '';
      document.getElementById('u-password').value = '';
      document.getElementById('u-role').value = 'student';
      document.getElementById('u-firstname').value = '';
      document.getElementById('u-lastname').value = '';
      document.getElementById('u-major').value = '';
      document.getElementById('u-year').value = '';
      document.getElementById('u-password').required = true;
    }

    function closeUserForm() {
      document.getElementById('edit-user-form').classList.add('d-none');
    }

    function editUser(u) {
      document.getElementById('edit-user-form').classList.remove('d-none');
      document.getElementById('user-form-title').innerText = "แก้ไขข้อมูลผู้ใช้งาน";
      document.getElementById('u-id').value = u.id;
      document.getElementById('u-username').value = u.username;
      document.getElementById('u-password').value = '';
      document.getElementById('u-password').required = false;
      document.getElementById('u-role').value = u.role;
      document.getElementById('u-firstname').value = u.firstname || u.name || '';
      document.getElementById('u-lastname').value = u.lastname || '';
      document.getElementById('u-major').value = u.major || '';
      document.getElementById('u-year').value = u.year || '';
    }

    async function handleUserForm(e) {
      e.preventDefault();
      const id = document.getElementById('u-id').value;
      const data = {
        username: document.getElementById('u-username').value,
        role: document.getElementById('u-role').value,
        firstname: document.getElementById('u-firstname').value,
        lastname: document.getElementById('u-lastname').value,
        major: document.getElementById('u-major').value,
        year: document.getElementById('u-year').value,
        name: document.getElementById('u-firstname').value + " " + document.getElementById('u-lastname').value
      };
      
      const pwd = document.getElementById('u-password').value;
      if (pwd) data.password = pwd;
      
      if (id) {
        data.id = id;
        const res = await apiCall('users.php', 'edit', 'POST', data);
        alert(res.message);
        if (res.success) { closeUserForm(); loadUsers(); }
      } else {
        const res = await apiCall('users.php', 'create', 'POST', data);
        alert(res.message);
        if (res.success) { closeUserForm(); loadUsers(); }
      }
    }

    init();
  </script>
</body>
</html>
